---
- name: Deploy Harjus
  hosts: harjus_instance
  gather_facts: no
  become: yes
  # Variables from group_vars/harjus_instance/common.yml are loaded automatically
  # Variables from group_vars/harjus_instance/<env>.yml will be loaded based on 'env' var

  vars:

    ansible_ssh_private_key_file: "{{ playbook_dir }}/../harjus-ec2-key.pem"
    ansible_user: ubuntu
    harjus_dir: /opt/harjus
    service_name: "harjus"
    service_override_dir: "/etc/systemd/system/{{ service_name }}.service.d"
    app_env_override_file: "{{ service_override_dir }}/20-app-environment.conf"

  pre_tasks:
    - name: Load dotenv variables
      ansible.builtin.set_fact:
        assets: "{{ lookup('env', 'ASSETS')}}"
        binance_rest_api_uri: "{{ lookup('env', 'BINANCE_REST_API_URI')}}"
        binance_fix_api_hostname_orderentry: "{{ lookup('env', 'BINANCE_FIX_API_HOSTNAME_ORDERENTRY')}}"
        binance_fix_api_hostname_marketdata: "{{ lookup('env', 'BINANCE_FIX_API_HOSTNAME_MARKETDATA')}}"
        binance_ed25519_seed: "{{ lookup('env', 'BINANCE_ED25519_SEED')}}"
        binance_ed25519_api_key: "{{ lookup('env', 'BINANCE_ED25519_API_KEY')}}"
        commission: "{{ lookup('env', 'COMMISSION')}}"
        max_trading_path_length: "{{ lookup('env', 'MAX_TRADING_PATH_LENGTH')}}"
        log_level: "{{ lookup('env', 'LOG_LEVEL')}}"

  tasks:
    - name: Display deployment information
      ansible.builtin.debug:
        msg: "Starting deployment of '{{ service_name }}' for '{{ env_name | default(env) }}' env with version: '{{ version }}' on {{ inventory_hostname }}"

    - name: Copy service file to systemd directory
      ansible.builtin.copy:
        src: harjus.service
        dest: "/etc/systemd/system/{{ service_name }}.service"
        mode: '0644'
      notify: Reload systemd and restart app

    - name: Ensure systemd override directory exists
      ansible.builtin.file:
        path: "{{ service_override_dir }}"
        state: directory
        mode: '0755'

    - name: Create/Update systemd override for Application Environment
      ansible.builtin.template:
        src: templates/app_environment.conf.j2
        dest: "{{ app_env_override_file }}"
        mode: '0600' # Stricter permissions as it contains resolved secrets
      notify: Reload systemd and restart app

    - name: Create opt directory for harjus
      ansible.builtin.file:
        path: "{{ harjus_dir }}"
        state: directory
        mode: '0755'  

    - name: Download release from s3
      amazon.aws.s3_object:
        bucket: "{{ s3_bucket_name }}"
        object: harjus-{{ version }}.nar.gzip
        dest: "{{ harjus_dir }}/harjus-{{ version }}.nar.gzip"
        mode: get

    - name: Import to nix store
      ansible.builtin.shell: "bash -lc 'zcat {{ harjus_dir }}/harjus-{{ version }}.nar.gzip | nix-store --import|grep -e \"-harjus-\"'"
      register: import_result

    - name: Link build artifact to /usr/bin
      ansible.builtin.file:
        src: "{{ import_result.stdout }}/bin/{{ service_name }}"
        dest: "/usr/bin/{{ service_name }}"
        state: link
        force: yes
      notify: Reload systemd and restart app

    - name: Final deployment status message
      ansible.builtin.debug:
        msg: |
          Deployment of '{{ service_name }}' for '{{ env_name | default(env) }}' with version '{{ version }}' has been triggered.
          To check status: sudo systemctl status {{ service_name }}
          To tail logs: sudo journalctl -fu {{ service_name }}.service

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: yes
      listen: Reload systemd and restart app

    - name: Restart {{ service_name }} service
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: restarted
        enabled: false
      listen: Reload systemd and restart app
