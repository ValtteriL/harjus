---
- name: Deploy Harjus
  hosts: harjus_instance
  gather_facts: no
  become: yes
  # Variables from group_vars/harjus_instance/common.yml are loaded automatically
  # Variables from group_vars/harjus_instance/<env>.yml will be loaded based on 'env' var

  vars:
    ansible_ssh_private_key_file: "{{ playbook_dir }}/../harjus-ec2-key.pem"
    ansible_user: admin
    harjus_dir: /opt/harjus

    # Mandatory: User must specify 'qa' or 'prod' when running the playbook
    # e.g., uv run ansible-playbook ... -e "env=prod"
    # Set a default or leave empty to force user input. An empty string will fail the pre_task check.
    env: ""
    package_path: ""
    service_override_dir: "/etc/systemd/system/{{ service_name }}.service.d"
    app_env_override_file: "{{ service_override_dir }}/20-app-environment.conf"

  pre_tasks:
    - name: Validate 'env' variable
      ansible.builtin.fail:
        msg: "Variable 'env' must be set and be either 'qa' or 'prod'."
      when: env is not defined or env not in ['qa', 'prod']

    - name: Validate 'package_path' variable
      ansible.builtin.fail:
        msg: "Variable 'package_path' must be set to a valid release package path."
      when: package_path is not defined or package_path == ""

    - name: Load environment-specific variables (qa.yml or prod.yml)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/group_vars/harjus_instance/{{ env }}.yml"

  tasks:
    - name: Display deployment information
      ansible.builtin.debug:
        msg: "Starting deployment of '{{ service_name }}' for '{{ env_name | default(env) }}' env on {{ inventory_hostname }}"

    - name: Copy service file to systemd directory
      ansible.builtin.copy:
        src: harjus.service
        dest: "/etc/systemd/system/{{ service_name }}.service"
        mode: "0644"
      notify: Reload systemd and restart app

    - name: Ensure systemd override directory exists
      ansible.builtin.file:
        path: "{{ service_override_dir }}"
        state: directory
        mode: "0755"

    - name: Create/Update systemd override for Application Environment
      ansible.builtin.template:
        src: templates/app_environment.conf.j2
        dest: "{{ app_env_override_file }}"
        mode: "0600" # Stricter permissions as it contains resolved secrets
      notify: Reload systemd and restart app

    - name: Create opt directory for harjus
      ansible.builtin.file:
        path: "{{ harjus_dir }}"
        state: directory
        mode: "0755"

    - name: Upload release package
      ansible.builtin.copy:
        src: "{{ package_path }}"
        dest: "{{ harjus_dir }}/harjus.tar.gz"
        mode: "0644"

    - name: Unarchive release package
      ansible.builtin.unarchive:
        src: "{{ harjus_dir }}/harjus.tar.gz"
        dest: /opt
        remote_src: yes

    - name: Run initialize.sh
      ansible.builtin.command:
        cmd: "{{ harjus_dir }}/bin/initialize.sh ens5"
      notify: Reload systemd and restart app

    - name: Final deployment status message
      ansible.builtin.debug:
        msg: |
          Deployment of '{{ service_name }}' for '{{ env_name | default(env) }}' has been triggered.
          To check status: sudo systemctl status {{ service_name }}
          To tail logs: sudo journalctl -fu {{ service_name }}.service

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: yes
      listen: Reload systemd and restart app

    - name: Restart {{ service_name }} service
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: restarted
        enabled: false
      listen: Reload systemd and restart app
