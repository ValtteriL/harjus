# inventory for AWS EC2 instances
# This inventory file is used to dynamically generate an inventory of AWS EC2 instances
# https://docs.ansible.com/ansible/latest/collections/amazon/aws/aws_ec2_inventory.html
plugin: amazon.aws.aws_ec2
regions:
  - ap-northeast-1
filters:
  "tag:Name": "harjus-instance"
keyed_groups:
  - key: tags['Name']
    separator: ''
