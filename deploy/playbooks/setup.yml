---
- name: Providion Harjus instance
  hosts: harjus_instance
  gather_facts: no
  become: yes
  vars:
    ansible_ssh_private_key_file: "{{ playbook_dir }}/../harjus-ec2-key.pem"
    ansible_user: ec2-user
  tasks:
  
    - name: Install packages
      ansible.builtin.package:
        name:
          - tmux
          - htop
          - vim
          - nix-bin
          - nix-setup-systemd
        state: present
        update_cache: yes

    - name: Grant user nix permissions
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: nix-users
        append: true

    - name: Set default nix channels
      ansible.builtin.shell:
        cmd: nix-channel --add https://nixos.org/channels/nixpkgs-unstable nixpkgs && nix-channel --update
        creates: /home/{{ ansible_user }}/.nix-defexpr/channels/nixpkgs

    - name: allow unsigned nix packages
      ansible.builtin.lineinfile:
        path: /etc/nix/nix.conf
        line: require-sigs = false
        state: present
      notify: Reload nix-daemon

  handlers:
    - name: Reload nix-daemon
      ansible.builtin.systemd:
        name: nix-daemon
        state: started
        daemon_reload: yes
        enabled: yes
        reload: yes
