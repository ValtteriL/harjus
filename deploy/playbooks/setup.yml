---
- name: Providion Harjus instance
  hosts: harjus_instance
  gather_facts: no
  become: yes
  vars:
    ansible_ssh_private_key_file: "{{ playbook_dir }}/../harjus-ec2-key.pem"
    ansible_user: ec2-user
  tasks:
  
    - name: Install packages
      ansible.builtin.apt:
        name:
          - docker.io
          - tmux
          - htop
          - vim
          - awscli
        state: present
        update_cache: yes

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
