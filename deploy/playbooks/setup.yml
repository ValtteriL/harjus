---
- name: Providion Harjus instance
  hosts: harjus_instance
  gather_facts: no
  become: yes
  vars:
    ansible_ssh_private_key_file: "{{ playbook_dir }}/../harjus-ec2-key.pem"
    ansible_user: ec2-user
  tasks:
  
    - name: Install packages
      ansible.builtin.package:
        name:
          - tmux
          - htop
          - vim
        state: present
        update_cache: yes
