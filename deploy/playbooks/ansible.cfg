[defaults]
inventory = aws_ec2.yml
# skip checking for host key as we are using dynamic inventory
# and the host key is not known yet
host_key_checking = False
pipelining = True

# silence warnings on host python discovery
interpreter_python = auto_silent

[privilege_escalation]
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

