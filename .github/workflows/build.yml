name: Build

# build if push to main
# if tagged with releases/X.Y.Z, deploy additionally to QA

on:
  push:
    tags: releases/[1-9]+.[0-9]+.[0-9]+
    branches: main

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    runs-on: ubuntu-latest
    needs: [quality]

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::137068223640:role/GithubAction

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build image
        run: |
          nix-build

      - name: Push latest and hash-tagged image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: harjus
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=`docker image load -q < result-2|awk '{print $3}'`
          
          docker tag $IMAGE $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag $IMAGE $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push release-tagged image to ECR
        if: startsWith(github.ref, 'refs/tags/releases/')
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: harjus
          IMAGE_TAG: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          SEMVER_TAG=$(echo $RELEASE_VERSION | sed 's/^releases\///')
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$SEMVER_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SEMVER_TAG
