name: Quality check

# This is reusable by other workflows
on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Activate nix-shell and run mix quality.ci
        run: |
          nix-shell -A devEnv --run "mix local.hex --force && mix deps.get && mix quality.ci"
