###############################################################################
# F-Stack / DPDK Configuration for FlashFix
# Optimized for ULTRA-LOW LATENCY trading applications
###############################################################################

[dpdk]
# ============================================================================
# DPDK Core & Memory Configuration
# ============================================================================

# Hexadecimal bitmask of CPU cores for DPDK poll-mode driver.
# Dedicate specific cores to avoid context switching. Use isolcpus on host.
# Example: 0x1 = core 0, 0x3 = cores 0-1, 0xF = cores 0-3
lcore_mask=1

# Number of memory channels on the CPU. Match your hardware (check dmidecode).
# More channels = higher memory bandwidth for packet processing.
channel=4

# Promiscuous mode: receive all packets regardless of MAC address.
# Enable (1) for debugging/monitoring, disable (0) in production for security.
promiscuous=0

# NUMA-aware memory allocation. Always enable (1) to avoid cross-NUMA penalties.
# Ensure NIC and cores are on the same NUMA node for lowest latency.
numa_on=1

# ============================================================================
# TX/RX Offload Configuration
# ============================================================================

# Skip hardware TX checksum offload. Keep disabled (0) to leverage NIC offload.
# Only enable if NIC has buggy offload or for testing with bad checksums.
tx_csum_offoad_skip=0

# TCP Segmentation Offload. Disable (0) for low-latency - TSO batches packets
# and adds latency. Only useful for high-throughput bulk transfers.
tso=0

# Hardware VLAN tag stripping. Enable (1) if using VLANs, otherwise no impact.
vlan_strip=1

# VLAN filter IDs for L3/L4 RSS with VLAN headers.
# Only relevant if traffic is VLAN-tagged.
vlan_filter=1,2,4-6

# ============================================================================
# Polling & Packet Transmission Behavior (CRITICAL FOR LATENCY)
# ============================================================================

# Sleep duration (microseconds) when no packets are incoming.
# SET TO 0: Never sleep - continuous polling for minimum latency.
# Higher values save CPU but add latency on packet arrival.
idle_sleep=0

# TX packet batching delay (microseconds) when fewer than 32 packets queued.
# SET TO 0: Send packets IMMEDIATELY without batching.
# Default 100us adds significant latency - unacceptable for HFT.
pkt_tx_delay=0

# Symmetric RSS: ensures bidirectional flows hash to same core.
# Disable (0) unless you need flow affinity across directions.
symmetric_rss=0

# ============================================================================
# Port & Virtual Device Configuration
# ============================================================================

# PCI device enable list (whitelist).
# Specify which NIC(s) to use by PCI address. Find addresses with: dpdk-devbind.py --status
# Examples: allow=00:13.0 or allow=02:00.0,03:00.0 for multiple devices
# Uncomment and set to match your environment:
#allow=00:13.0

# Comma-separated list of DPDK port IDs to use.
port_list=0

# Number of virtual devices (vhost, virtio, etc.). 0 for physical NICs only.
nb_vdev=0

# Number of bonded interfaces. 0 unless using NIC bonding for HA.
nb_bond=0

###############################################################################
# PCAP Capture (Debug Only - Disable in Production)
###############################################################################
[pcap]
# Packet capture for debugging. DISABLE (0) in production - adds latency.
enable=0
# Bytes per packet to capture.
snaplen=96
# Max capture file size in bytes.
savelen=16777216
# Capture file directory.
savepath=.

###############################################################################
# Network Interface Configuration
# Static IP required - DHCP not supported with DPDK bypass.
###############################################################################
[port0]
# IPv4 address for this DPDK port. Must be unique and routable.
addr=192.168.1.137
netmask=255.255.255.0
broadcast=192.168.1.255
gateway=192.168.1.1

###############################################################################
# FreeBSD Network Stack - Boot-time Parameters
# These are set once at initialization and cannot be changed at runtime.
###############################################################################
[freebsd.boot]

# Kernel tick frequency (ticks per second). CRITICAL FOR LATENCY.
# Higher = finer timer granularity = lower latency for timeouts/retransmits.
# 1000000 = 1 microsecond resolution (required for RACK/BBR, recommended always)
# Default 100 = 10ms resolution - FAR too coarse for HFT.
hz=1000000

# Reserved file descriptors for kernel. Increase if hitting FD limits.
fd_reserve=1024

# Maximum number of sockets. Size for peak concurrent connections.
kern.ipc.maxsockets=262144

# SYN cache hash table size. Larger = faster SYN lookup under load.
net.inet.tcp.syncache.hashsize=4096
# Max SYN entries per hash bucket.
net.inet.tcp.syncache.bucketlimit=100

# TCP control block hash table size. Larger = faster connection lookup.
net.inet.tcp.tcbhashsize=65536

# Callout (timer) table size. Must accommodate all pending timers.
kern.ncallout=262144

# IPv6 support. Enable (1) if using IPv6, otherwise disable to save memory.
kern.features.inet6=1

###############################################################################
# FreeBSD Network Stack - Runtime Sysctl Parameters
# Optimized for ULTRA-LOW LATENCY trading
###############################################################################
[freebsd.sysctl]

# ============================================================================
# Socket & Buffer Configuration
# ============================================================================

# Max pending connections in listen queue. High value prevents drops.
kern.ipc.somaxconn=32768

# Max socket buffer size (bytes). Caps send/receive buffer sizes.
kern.ipc.maxsockbuf=16777216

# Add addresses to all FIBs (routing tables).
net.add_addr_allfibs=1

# Max packets held waiting for ARP resolution.
net.link.ether.inet.maxhold=5

# ============================================================================
# TCP Performance Tuning (LATENCY-CRITICAL)
# ============================================================================

# Fast FIN_WAIT_2 recycling. Enable (1) to quickly reclaim connection state.
net.inet.tcp.fast_finwait2_recycle=1

# Default send buffer size. Smaller = less buffering latency.
# 16KB is good for low-latency; increase only for high-bandwidth bulk.
net.inet.tcp.sendspace=16384

# Default receive buffer size. 8KB adequate for FIX messages.
net.inet.tcp.recvspace=8192

# Congestion control algorithm.
# 'cubic' is default. Consider 'newreno' for more predictable behavior.
# For ultra-low latency on dedicated links, CC algorithm matters less.
net.inet.tcp.cc.algorithm=cubic

# Max send/receive buffer sizes (bytes). Caps per-socket buffers.
net.inet.tcp.sendbuf_max=16777216
net.inet.tcp.recvbuf_max=16777216

# Auto-tuning of send/receive buffers. Disable (0) for deterministic behavior,
# or enable (1) to let stack adapt to conditions.
net.inet.tcp.sendbuf_auto=0
net.inet.tcp.recvbuf_auto=0

# Send buffer auto-increment size. Only relevant if auto-tuning enabled.
net.inet.tcp.sendbuf_inc=16384

# Selective ACK. Enable (1) for faster recovery from packet loss.
net.inet.tcp.sack.enable=1

# TCP blackhole: silently drop packets to closed ports (no RST).
# Reduces attack surface and processing overhead.
net.inet.tcp.blackhole=1

# Maximum Segment Lifetime (ms). Lower = faster TIME_WAIT recycling.
# 2000ms is conservative; 1000ms or lower if network is reliable.
net.inet.tcp.msl=1000

# Delayed ACK. DISABLE (0) FOR LOW LATENCY.
# Delayed ACK waits up to 40ms before sending ACK - catastrophic for HFT.
# Immediate ACKs ensure sender knows delivery status ASAP.
net.inet.tcp.delayed_ack=0

# RFC 1323 TCP extensions (timestamps, window scaling).
# Enable (1) for large windows. Timestamps add 12 bytes/packet overhead
# but improve RTT estimation. Keep enabled unless every byte counts.
net.inet.tcp.rfc1323=1

# ============================================================================
# UDP Configuration
# ============================================================================

# UDP blackhole: silently drop packets to closed ports.
net.inet.udp.blackhole=1

# ============================================================================
# IP Configuration
# ============================================================================

# Disable ICMP redirects (security best practice).
net.inet.ip.redirect=0

# Disable IP forwarding (not a router).
net.inet.ip.forwarding=0

# ============================================================================
# IPv6 Configuration (if enabled)
# ============================================================================
net.inet6.ip6.auto_linklocal=1
net.inet6.ip6.accept_rtadv=2
net.inet6.icmp6.rediraccept=1
net.inet6.ip6.forwarding=0

# ============================================================================
# TCP Stack Selection
# ============================================================================

# TCP stack implementation. Options: freebsd, rack, bbr
# - 'freebsd': Traditional stack, lowest overhead, recommended for HFT.
# - 'rack': Recent ACK-based recovery, good for lossy networks.
# - 'bbr': Bottleneck Bandwidth RTT, optimizes for throughput.
# For dedicated low-latency links, 'freebsd' is simplest and fastest.
net.inet.tcp.functions_default=freebsd

# HPTS (High Precision Timer System) - required by RACK/BBR stacks.
# Skip software interrupt for HPTS. Enable (1) for lower latency with RACK/BBR.
net.inet.tcp.hpts.skip_swi=1

# HPTS minimum sleep interval (microseconds). Lower = more responsive timers.
# With hz=1000000, can go as low as 1us. 100us is aggressive but safe.
net.inet.tcp.hpts.minsleep=100

# HPTS maximum sleep interval (microseconds). Lower = more CPU, faster response.
# Range: 25600-51200. Use lower end for latency-sensitive applications.
net.inet.tcp.hpts.maxsleep=25600
